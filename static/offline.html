<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
	<meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)">
	<link rel="stylesheet" href="/static/css/style.css">
	<title>You're offline</title>
</head>
<body>
	<div class="auth-page">
		<div class="auth-header">
			<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="crdledger">
				<circle cx="20" cy="20" r="19" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
				<path d="M12 20h16M20 12v16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
			</svg>
			<h1 class="text-title-1">You're offline</h1>
			<p>crdledger needs a connection to load your ledger balances are never cached, so we don't show stale numbers. Anything else already visited will still work.</p>
		</div>
		<button id="offline-retry" class="btn-primary btn-max">Try again</button>
	</div>
	<script src="/static/js/offline.js" defer></script>
</body>
</html>
