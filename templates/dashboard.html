<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/static/css/style.css">
	<title>Dashboard — crdledger</title>
</head>
<body>
{{template "sidebar" .}}
	<div style="display: flex; align-items: center; gap: 12px;">
	{{if .PhotoPath}}
	<img src="{{.PhotoPath}}" alt="Profile photo" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover;">
	{{end}}
	<h1>Welcome, {{.DisplayName}}</h1>
</div>


	<div class="balance-summary">
		<div class="balance-card">
			<div class="label">Total receivable</div>
			<div class="value">{{.TotalReceivable}}</div>
		</div>
		<div class="balance-card">
			<div class="label">Total owed</div>
			<div class="value">{{.TotalOwed}}</div>
		</div>
	</div>

	<form method="POST" action="/logout">
		<button type="submit">Log out</button>
	</form>
{{template "sidebar_end" .}}
</body>
</html>
