{{define "record_form"}}
<div id="record-form-wrap">
	{{if .Success}}
	<div class="record-success" role="status">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
		Recorded. Add another below, or head to the ledger.
	</div>
	{{end}}

	{{if .Error}}
	<p class="error" role="alert">{{.Error}}</p>
	{{end}}

	<form method="POST" action="/transactions/new" class="stack glass card"
		hx-post="/transactions/new" hx-target="#record-form-wrap" hx-swap="outerHTML" hx-indicator="#record-spinner">
		<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
		<label>
			Buyer's username
			<input type="text" name="buyer_username" placeholder="e.g. tobi_okafor" autocomplete="off" value="{{.BuyerUsername}}" required autofocus>
		</label>
		<label>
			Amount
			<input type="number" name="amount" step="0.01" min="0.01" inputmode="decimal" placeholder="0.00" value="{{.Amount}}" required>
		</label>
		<label>
			Description
			<input type="text" name="description" placeholder="e.g. provisions, phone credit" value="{{.Description}}" required>
		</label>
		<button type="submit" class="btn-primary">
			<span id="record-spinner" class="htmx-indicator spinner"></span>
			{{template "icon_record"}} Record transaction
		</button>
	</form>
</div>
{{end}}
