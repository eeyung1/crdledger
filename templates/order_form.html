{{define "order_form"}}
<div id="order-form-wrap">
	{{if .Success}}
	<div class="banner is-success" role="status">{{template "icon_check"}} Added. Add another below, or head to the ledger.</div>
	{{end}}

	{{if .Error}}
	<div class="banner is-error" role="alert">{{template "icon_alert"}} {{.Error}}</div>
	{{end}}

	<form method="POST" action="/orders/new" enctype="multipart/form-data" class="stack surface card"
		hx-post="/orders/new" hx-encoding="multipart/form-data" hx-target="#order-form-wrap" hx-swap="outerHTML" hx-indicator="#order-spinner">
		<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
		<label>
			Seller's username
			<input type="text" name="seller_username" placeholder="e.g. maxchichar" autocomplete="off" value="{{.SellerUsername}}" required autofocus>
		</label>
		<label>
			Amount
			<input type="number" name="amount" step="0.01" min="0.01" inputmode="decimal" placeholder="0.00" value="{{.Amount}}" required>
		</label>
		<label>
			Description
			<input type="text" name="description" placeholder="e.g. provisions, phone credit" value="{{.Description}}" required>
		</label>
		<label>
			Receipt photo <span class="text-footnote">(optional)</span>
			<input type="file" name="receipt" accept="image/jpeg,image/png,image/gif">
		</label>
		<button type="submit" class="btn-primary">
			<span id="order-spinner" class="htmx-indicator spinner"></span>
			{{template "icon_cart"}} Add order
		</button>
	</form>
</div>
{{end}}
