<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/static/css/style.css">
	<title>Record a transaction — crdledger</title>
</head>
<body class="dark">
{{template "sidebar" .}}
	<h1>Record a transaction</h1>

	{{if .Error}}
	<p class="error">{{.Error}}</p>
	{{end}}

	<form method="POST" action="/transactions/new" style="max-width: 340px;">
		<label>
			Buyer's username
			<input type="text" name="buyer_username" required>
		</label>
		<label>
			Amount
			<input type="number" name="amount" step="0.01" min="0.01" required>
		</label>
		<label>
			Description
			<input type="text" name="description" required>
		</label>
		<button type="submit" class="btn-primary">Record</button>
	</form>
{{template "sidebar_end" .}}
</body>
</html>
