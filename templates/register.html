<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/static/css/style.css">
	<title>Register — crdledger</title>
</head>
<body class="dark auth-page">
	<div class="auth-header">
		{{template "logo"}}
		<h1>crdledger</h1>
		<p>Never forget who owes who</p>
	</div>

	{{if .Error}}
	<p class="error">{{.Error}}</p>
	{{end}}

	<form class="auth-form" method="POST" action="/register">
		<label>
			Username
			<input type="text" name="username" placeholder="Choose a username" required>
		</label>
		<label>
			Password
			<input type="password" name="password" placeholder="Choose a password" required>
		</label>
		<label>
			Display name
			<input type="text" name="display_name" placeholder="Enter your display name" required>
		</label>
		<button type="submit" class="btn-primary">Register</button>
	</form>

	<p class="auth-footer">Already have an account? <a href="/login">Log in</a></p>
</body>
</html>
