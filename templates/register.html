<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<link rel="stylesheet" href="/static/css/style.css">
	{{template "pwa_head" .}}
	<title>Register</title>
</head>
<body class="auth-page">
	<div class="auth-header">
		{{template "logo"}}
		<h1 class="text-title-1">crdledger</h1>
		<p>Never forget who owes who</p>
	</div>

	{{if .Error}}
	<div class="banner is-error" role="alert">{{template "icon_alert"}} {{.Error}}</div>
	{{end}}

	<form class="auth-form surface card stack" method="POST" action="/register">
		<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
		<label>
			Username
			<input type="text" name="username" placeholder="Choose a username" autocomplete="username" required autofocus>
		</label>
		<label>
			Email
			<input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
		</label>
		<label>
			Password
			<input type="password" name="password" placeholder="Choose a password" autocomplete="new-password" required>
		</label>
		<label>
			Display name
			<input type="text" name="display_name" placeholder="What should people call you?" autocomplete="name" required>
		</label>
		<fieldset class="account-type-picker">
			<legend>Account type</legend>
			<label><input type="radio" name="account_type" value="buyer" required> Buyer <span class="text-footnote">Free · add orders and view your ledger</span></label>
			<label><input type="radio" name="account_type" value="seller" required> Seller <span class="text-footnote">Record credit transactions and manage repayments</span></label>
		</fieldset>
		<fieldset class="seller-plan-picker">
			<legend>Seller plan</legend>
			<label class="plan-card"><input type="radio" name="subscription_plan" value="monthly"> <span><strong>Monthly</strong><span class="text-footnote">₦2,000 / month</span></span></label>
			<label class="plan-card"><input type="radio" name="subscription_plan" value="yearly"> <span><strong>Yearly</strong><span class="text-footnote">₦15,000 / year · Save ₦9,000</span></span></label>
		</fieldset>
		<button type="submit" class="btn-primary">Create account</button>
	</form>

	<p class="auth-footer">Already have an account? <a href="/login">Log in</a></p>
<script src="/static/js/app.js" defer></script>
</body>
</html>
