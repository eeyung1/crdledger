{{define "sidebar"}}
<div style="display: flex; gap: 20px; min-height: 100vh;">
	<nav style="width: 160px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; padding-top: 4px;">
		<a href="/dashboard" style="display: block; padding: 12px 14px; border-radius: 10px; background: var(--navy-card); border: 1px solid var(--border-color); color: var(--text-primary); text-align: center; font-weight: 600;">Dashboard</a>
		<a href="/profile/edit" style="display: block; padding: 12px 14px; border-radius: 10px; background: var(--navy-card); border: 1px solid var(--border-color); color: var(--text-primary); text-align: center; font-weight: 600;">Edit profile</a>
		<a href="/transactions/new" style="display: block; padding: 12px 14px; border-radius: 10px; background: var(--navy-card); border: 1px solid var(--border-color); color: var(--text-primary); text-align: center; font-weight: 600;">Record a transaction</a>
		<a href="/transactions" style="display: block; padding: 12px 14px; border-radius: 10px; background: var(--navy-card); border: 1px solid var(--border-color); color: var(--text-primary); text-align: center; font-weight: 600;">Transactions</a>
		<form method="POST" action="/logout" style="margin: 0;">
			<button type="submit" style="width: 100%; padding: 12px 14px; border-radius: 10px; background: #4338ca; border: none; color: white; font-weight: 600; font-size: 16px; cursor: pointer;">Log out</button>
		</form>
	</nav>
	<div style="flex: 1; min-width: 0;">
{{end}}
{{define "sidebar_end"}}
	</div>
</div>
{{end}}
