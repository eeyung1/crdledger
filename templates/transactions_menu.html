<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<link rel="stylesheet" href="/static/css/style.css">
	{{template "pwa_head" .}}
	<title>Transactions — crdledger</title>
</head>
<body class="dark">
{{template "sidebar" .}}
	<p class="eyebrow">The ledger</p>
	<h1 style="margin-bottom:22px;">Transactions</h1>

	<div class="balance-summary" style="grid-template-columns: 1fr;">
		<a href="/transactions/creditors" class="balance-card link-card glass receivable">
			<div class="label">{{template "icon_receivable"}} Creditors</div>
			<div class="value" style="font-family: var(--font-body); font-size: 16px;">People who owe you money</div>
		</a>
		<a href="/transactions/debtors" class="balance-card link-card glass owed">
			<div class="label">{{template "icon_owed"}} Debtors</div>
			<div class="value" style="font-family: var(--font-body); font-size: 16px;">People you owe money</div>
		</a>
	</div>
{{template "sidebar_end" .}}
</body>
</html>
