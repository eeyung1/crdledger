<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<link rel="stylesheet" href="/static/css/style.css">
	{{template "pwa_head" .}}
	<title>Transactions</title>
</head>
<body>
{{template "sidebar" .}}
	<p class="text-caption">The ledger</p>
	<h1 class="text-title-1 page-title">Transactions</h1>

	<div class="balance-summary">
		<a href="/transactions/creditors" class="balance-card surface receivable">
			<div class="label">{{template "icon_receivable"}} Creditors</div>
			<div class="sub-value">People who owe you money</div>
		</a>
		<a href="/transactions/debtors" class="balance-card surface owed">
			<div class="label">{{template "icon_owed"}} Debtors</div>
			<div class="sub-value">People you owe money</div>
		</a>
	</div>

	<a href="/transactions/export.csv" class="btn btn-ghost btn-max">{{template "icon_receipt"}} Export as CSV</a>
{{template "sidebar_end" .}}
</body>
</html>
