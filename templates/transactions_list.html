<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<link rel="stylesheet" href="/static/css/style.css">
	{{template "pwa_head" .}}
	<title>{{.Title}} crdledger</title>
</head>
<body data-offline-user-key="{{.UserID}}">
{{template "sidebar" .}}
	<div class="list-header">
		<div>
			<p class="text-caption">The ledger</p>
			<h1 class="text-title-1 page-title">{{.Title}}</h1>
		</div>

		{{if .ShowSearch}}
		<form method="GET" action="{{.BasePath}}" class="search-form btn-row" role="search">
			<input type="text" name="q" placeholder="Search by name or username" value="{{.Query}}"
				hx-get="{{.BasePath}}" hx-trigger="keyup changed delay:400ms, search" hx-target="#tx-list-wrap"
				hx-swap="innerHTML" hx-push-url="true" hx-indicator="#search-spinner">
			<button type="submit" class="btn btn-ghost">
				<span id="search-spinner" class="htmx-indicator spinner" aria-hidden="true"></span>
				Search
			</button>
			{{if .Query}}<a href="{{.BasePath}}" class="btn btn-ghost">Clear</a>{{end}}
		</form>
		{{end}}
	</div>

	<dialog id="payment-date-dialog" class="payment-dialog" aria-labelledby="payment-dialog-title">
		<form method="dialog" class="payment-dialog-card">
			<div>
				<p class="text-caption">Settle transaction</p>
				<h2 id="payment-dialog-title">Date of payment</h2>
				<p class="text-footnote">Choose when the payment was received.</p>
			</div>
			<label for="payment-date-picker">Payment date</label>
			<input id="payment-date-picker" type="date" required>
			<div class="payment-dialog-actions">
				<button type="button" class="btn btn-ghost" data-payment-cancel>Cancel</button>
				<button type="button" class="btn btn-primary" data-payment-confirm>Confirm payment</button>
			</div>
		</form>
	</dialog>

	<div id="tx-list-wrap">
		{{template "tx_list_fragment" .}}
	</div>
{{template "sidebar_end" .}}
</body>
</html>
